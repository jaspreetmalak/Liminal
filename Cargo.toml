[package]
name = "liminal"
default-run = "liminal"
version = "0.1.0"
edition = "2024"
publish = false
description = "A spiking neural language model built from scratch in Rust"

[dependencies]
burn = { version = "0.22.0", default-features = false, features = ["std", "optim", "wgpu", "flex", "fusion"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde_json = "1"
sha2 = "0.11.1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
